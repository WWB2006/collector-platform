[project]
name = "collector-platform"
version = "0.1.0"
description = "Device data collection and test-report platform (Modbus / CSV replay -> SQLite -> stats, alarms, API, HTML report)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=app --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: 需要外部进程（项目二从站模拟器）的用例，缺少时自动跳过",
    "slow: 耗时较长的用例（性能实测）",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/web/*", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
